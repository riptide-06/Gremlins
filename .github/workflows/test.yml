name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.4"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m compileall -q prototypes/cubbies
      - name: Campus Cubbies tests
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser guide and domain proxy tests
        run: node --test prototypes/cubbies/browser-guide.test.mjs prototypes/cubbies/domain-proxy.test.mjs
