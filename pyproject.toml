[project]
name = "gremlins"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.2.2",
  "authlib>=1.6,<2",
  "google-cloud-firestore>=2.20,<3",
  "itsdangerous>=2.2,<3",
  "litellm>=1.70,<2",
  "mcp>=1.10,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "test_cloud.py"]
